# Continuous integration for runnerize.
#
# Gating model:
#   - "Lint & parse" and "Unit tests" run on EVERY pull request (including fork
#     PRs) and every push to main. They need no secrets, so they are the
#     universal, always-green-or-red blocker. Mark these as required status
#     checks in branch protection.
#   - "E2E" needs a real GitHub token, a throwaway repo, and podman, so it can
#     only run where repository secrets are exposed. Fork PRs do NOT receive
#     secrets, so the job is skipped there. A job skipped by its `if` condition
#     reports "Success", so E2E is still safe to require in branch protection:
#     it genuinely blocks same-repo PRs and pushes to main, and is a no-op pass
#     on fork PRs. If a maintainer requires E2E, fork PRs will still be
#     mergeable (skipped == success) and same-repo changes are truly gated.
name: CI

on:
  pull_request:
  push:
    # release/** so the reconcile PR the publish workflow opens gets checks. GitHub does not
    # trigger workflows for events raised by GITHUB_TOKEN, so those PRs report no checks at all
    # and sit blocked forever against a required status - which is why several were stuck open.
    # A push-triggered run reports on the same head commit, which satisfies the requirement.
    branches: [main, 'release/**']

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same PR branch; never cancel main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # Syntax-check the CLI entrypoints and every source/tool module without
      # executing anything. Covers every file under bin/ (CLI binaries may be
      # extensionless) plus JavaScript modules under src/ and tools/. Missing
      # directories are tolerated so this never crashes on layout changes.
      - name: Parse-check bin/**, src/**/*.js, and tools/**/*.mjs
        run: |
          set -euo pipefail
          files="$( { find bin -type f 2>/dev/null; find src tools -type f \( -name '*.js' -o -name '*.mjs' \) 2>/dev/null; } | sort )"
          if [ -z "$files" ]; then
            echo "::error::no files found to syntax-check"
            exit 1
          fi
          printf '%s\n' "$files" | while IFS= read -r f; do
            echo "node --check $f"
            node --check "$f"
          done

  bundle:
    name: Bundle & determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build twice and verify deterministic output
        run: |
          set -euo pipefail
          npm run build
          first="$(sha256sum dist/runnerize.mjs | cut -d' ' -f1)"
          npm run build
          second="$(sha256sum dist/runnerize.mjs | cut -d' ' -f1)"
          test "$first" = "$second"
          node tools/bundle.mjs --check

  sea:
    name: Build SEA (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each target is built on a host that can actually EXECUTE it, so the smoke test below
        # exercises the artifact rather than only proving it links. A cross-built binary that is
        # never launched tells you nothing about whether the embedded app runs.
        include:
          - target: linux-x64
            os: ubuntu-latest
            binary: dist/linux-x64/runnerize
          - target: win-x64
            os: windows-latest
            binary: dist/win-x64/runnerize.exe
          - target: darwin-arm64
            os: macos-14
            binary: dist/darwin-arm64/runnerize
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
      - name: Build checksum-verified executable
        run: |
          npm run build
          node tools/build-sea.mjs "${{ matrix.target }}"
      - name: Smoke-test the executable against the source tree
        shell: bash
        run: |
          set -euo pipefail
          bin="${{ matrix.binary }}"
          test -x "$bin" || { echo "::error::$bin is not executable"; exit 1; }
          # An unknown command exits 1 and prints a known line; compare the compiled artifact to
          # the tree so a SEA that silently behaves as plain node cannot pass.
          set +e
          "./$bin" wat > /tmp/sea.out 2>&1; sea_status=$?
          node bin/runnerize.js wat > /tmp/tree.out 2>&1; tree_status=$?
          set -e
          diff /tmp/tree.out /tmp/sea.out
          test "$sea_status" = "$tree_status"
          echo "SEA matches the tree (exit $sea_status)"
      - name: Exercise the executable end to end
        shell: bash
        run: |
          set -euo pipefail
          export RUNNERIZE_BINARY="$PWD/${{ matrix.binary }}"
          # Execution parity and SEA-awareness against the compiled artifact.
          node --test test/integration/binary-install.test.js
          # Re-run the unit suite with the real executable standing in for the binary-layout
          # stub, so materialization, the mode bits and the ExecStart wiring see a real file.
          node --test test/unit/service.test.js

  # The one check branch protection should require. Every other job is a matrix entry whose
  # name changes whenever a platform or Node version is added, and a renamed job silently
  # becomes an unsatisfiable required check that blocks every PR forever. Requiring this
  # aggregate instead means the matrix can change freely without touching branch protection.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, bundle, sea, packaging, unit, e2e]
    steps:
      - name: Require every job to have succeeded or been deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "upstream results: $RESULTS"
          # 'skipped' is legitimate: E2E skips on fork PRs, which have no secrets. Anything
          # else - failure, cancelled, or a job that never ran - must block.
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$result'"; exit 1 ;;
            esac
          done
          echo "All CI jobs passed."

  packaging:
    name: Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # `npx runnerize@latest service install` runs from an npm-installed copy, not a checkout.
      # Nothing covered that layout, so a package missing src/ or resolving its root to the
      # wrong directory would only fail on a user's machine.
      - name: Pack, install, and run the published layout
        run: node --test test/integration/packaging.test.js

  unit:
    name: Unit tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary deployment target: Task Scheduler, the PowerShell launcher, WSL
        # interop and the guard only take their real branches there. macOS covers the launchd and
        # tart paths. Running the suite on Linux alone leaves all of that behind stubs.
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No lockfile and zero runtime deps, so `npm ci` will fail; fall back to
      # `npm install`, which is effectively a no-op here.
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E
    needs: unit
    # Only run where repository secrets are available: pushes to main, and
    # pull requests originating from this repository (not forks). The `secrets`
    # context is NOT usable in a job-level `if`, so the secret-presence check is
    # done in the first step below instead.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Decide whether the E2E environment is configured. If E2E_GH_TOKEN or
      # E2E_REPO is missing, pass green with a notice instead of failing, so a
      # not-yet-configured repo is not blocked on setup it hasn't done.
      - name: Check E2E configuration
        id: check
        env:
          E2E_GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_REPO: ${{ vars.E2E_REPO }}
        run: |
          if [ -n "$E2E_GH_TOKEN" ] && [ -n "$E2E_REPO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped: set the E2E_GH_TOKEN secret and the E2E_REPO variable to enable end-to-end tests."
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Podman ships on the ubuntu-latest image; install only as a fallback.
      - name: Ensure podman is available
        if: steps.check.outputs.enabled == 'true'
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman --version
          else
            echo "podman not found; installing"
            sudo apt-get update
            sudo apt-get install -y podman
          fi

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        run: npm ci || npm install

      # Real end-to-end run against a throwaway repo. RUNNERIZE_LINUX_IMAGE
      # overrides the fat default image with a smaller one to keep CI fast;
      # override via the E2E_IMAGE repo variable if needed.
      - name: Run E2E tests
        if: steps.check.outputs.enabled == 'true'
        env:
          E2E_GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_REPO: ${{ vars.E2E_REPO }}
          RUNNERIZE_LINUX_IMAGE: ${{ vars.E2E_IMAGE || 'catthehacker/ubuntu:act-latest' }}
        run: npm run test:e2e
